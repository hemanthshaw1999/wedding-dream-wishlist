[build]
  command = "node --experimental-strip-types --check deploy/mail-worker/functions/auth-email.ts"
  publish = "deploy/mail-worker/public"

[build.environment]
  NODE_VERSION = "24.22.3"
  NEXT_TELEMETRY_DISABLED = "1"

[functions]
  directory = "deploy/mail-worker/functions"
  node_bundler = "esbuild"
  external_node_modules = ["pg"]

[functions.auth-email]
  schedule = "* * * * *"
